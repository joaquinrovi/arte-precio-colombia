[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arte-precio-colombia"
version = "0.1.0"
description = "Modelos reproducibles de precios de adjudicación de arte en Colombia"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<4", "openpyxl>=3.1,<4"]

[project.optional-dependencies]
ml = ["scikit-learn>=1.7,<2", "joblib>=1.4,<2"]
dev = ["ruff>=0.9,<1"]

[project.scripts]
arte-precio = "arte_precio.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
