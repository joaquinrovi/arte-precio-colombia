[data]
source = "data/raw/Base_arte_Colombia_v1.xlsx"
sheet = "Ventas"
output = "data/processed/ventas_modelo.csv"
require_base_flag = true
exclude_open_post_sale = true

[split]
train_end = "2024-12-31"
validation_end = "2025-12-31"

[model]
seed = 42
profile = "intrinseco"
permutation_repeats = 5

[baseline]
artist_prior_weight = 5.0
